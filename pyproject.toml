[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-platform"
version = "0.0.1"
description = "Adversarial AI security platform for the AgentForge Clinical Co-Pilot (P0 foundations)"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["agentforge"]
branch = false

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
