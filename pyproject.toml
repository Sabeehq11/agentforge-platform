[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-platform"
version = "0.0.1"
description = "Adversarial AI security platform for the AgentForge Clinical Co-Pilot (P2 contracts)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML==6.0.2",
    "jsonschema==4.26.0",
    "attrs==26.1.0",
    "jsonschema-specifications==2025.9.1",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["agentforge"]
branch = false

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
