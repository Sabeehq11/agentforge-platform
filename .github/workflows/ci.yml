##
# Platform CI (P0 through P5). Lint, typecheck, tests with a coverage floor, security scan,
# secret scan, markdown link check and a workflow guard. No secrets, no model calls, no request to the target: every
# test runs with sockets disabled.
# Live and paid runs are never part of this workflow. Later checkpoints add jobs and never remove one (ROADMAP 6).
#
# To make this block merging, mark the "CI" job as a required status check in branch protection for main. That is a
# repository setting and cannot be set from code. CODEOWNERS also only takes effect with that protection.

name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # the secret scan reads history

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install
      run: |
        python -m pip install -r requirements-dev.txt
        python -m pip install -e .

    - name: Lint (syntax and undefined names only; style is not gated)
      run: ruff check src tests scripts --select E9,F63,F7,F82

    - name: Typecheck
      run: mypy src

    - name: Tests and coverage
      run: python -m pytest --cov=agentforge --cov-report=term-missing --cov-fail-under=85

    - name: Security scan (Bandit, medium or high severity and confidence)
      run: bandit -r src -ll -iii -q

    - name: Secret scan
      run: python scripts/secret_scan.py

    - name: Markdown link check (case-sensitive, internal links only)
      run: python scripts/check_links.py

    - name: ADR check (at least two rejected alternatives each)
      run: python scripts/check_adrs.py

    - name: Threat-model check (category IDs, attributes, OWASP rows, summary length)
      run: python scripts/check_threat_model.py

    - name: Architecture check (summary length, agents, diagram, sections A to K, Built or Planned labels)
      run: python scripts/check_architecture.py

    - name: Architecture check tests
      run: python -m pytest tests/test_check_architecture.py -q

    - name: Contract tests (producer and consumer, nested failures, migration)
      run: python -m pytest tests/test_contracts.py tests/test_contracts_nested.py tests/test_store.py -q

    - name: Schema diff (a breaking v1 change without a version bump fails)
      run: python scripts/check_schema_diff.py

    - name: Workflow guard (no pull_request_target, least privilege, no secrets)
      run: python scripts/check_workflows.py

    - name: Suite schema validation (no live calls)
      run: python scripts/check_evals.py

    - name: Synthetic-data scan and allowlist tests (no live calls)
      run: python -m pytest tests/test_evals.py tests/test_p3_envelope.py tests/test_allowlist.py -q

    - name: Judge evaluation on the labeled set (recorded or stub responses only)
      run: python -m pytest tests/test_p4_judge.py -q

    - name: Orchestrator tests (scripted agents, no secrets, no network)
      run: python -m pytest tests/test_p6_journal.py tests/test_p6_state.py tests/test_p6_priority.py tests/test_p6_ratelimit.py tests/test_p6_cost.py tests/test_p6_handoff.py tests/test_p6_generator.py tests/test_p6_novelty.py tests/test_p6_caps.py tests/test_p6_variants.py tests/test_p6_trace.py tests/test_p6_identity.py tests/test_p6_envelope.py tests/test_p6_secrets.py -q
