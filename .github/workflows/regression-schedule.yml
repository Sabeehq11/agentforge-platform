# Stub regression schedule. This is not the durable local queue.
# It runs the in-repo stub tests against a temporary database and discards it.
# It does not open the local store, read an allowlist host, or set a live flag.

name: Regression schedule

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stub-suite:
    name: Stub regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Stub regression tests (temporary database, discarded with the runner)
        run: python -m pytest tests/test_p7_suite.py tests/test_p9_triggers.py -q
