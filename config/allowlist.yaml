# Target allowlist. Default deny. One reviewed host does not allow any other host.
#
# Adding an entry is a reviewed change (see .github/CODEOWNERS), never automatic. The Cloudflare quick tunnel
# hostname rotates (ADR-007), so each new URL is a deliberate edit. Wildcards are not supported.
#
# Entry shape:
#   - scheme: https
#     host: example-host.trycloudflare.com
#     port: 443
#     path_prefix: /
entries:
  - scheme: http
    host: 127.0.0.1
    port: 8300
    path_prefix: /
