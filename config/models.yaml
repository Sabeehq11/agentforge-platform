# Model per agent role (ADR-004). No key lives here.
# red_team and judge must have different `family` values; src/agentforge/models_config.py enforces it.
# orchestrator and documentation are deterministic. `none` means the role calls no model.
roles:
  red_team:
    provider: openrouter
    model: openai/gpt-4.1-mini
    family: openai
  judge:
    provider: openrouter
    model: anthropic/claude-sonnet-4.5
    family: anthropic
  orchestrator:
    provider: none
    model: none
    family: deterministic
  documentation:
    provider: none
    model: none
    family: deterministic
